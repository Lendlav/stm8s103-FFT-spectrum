name: Firmware

on:
  push:
    branches: [stm8s103-FFT-spectrum-sdcc]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install --yes sdcc=4.2.0+dfsg-1 sdcc-libraries=4.2.0+dfsg-1 make python3

      - name: Verify and build firmware
        run: make verify

      - name: Upload firmware files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stm8s103-firmware
          path: |
            build/stm8s103-FFT-spectrum.ihx
            build/stm8s103-FFT-spectrum.bin
            build/stm8s103-FFT-spectrum.map
          if-no-files-found: error
