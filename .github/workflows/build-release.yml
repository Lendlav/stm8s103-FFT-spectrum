name: Firmware

on:
  push:
    branches: [stm8s103-FFT-spectrum-sdcc]

concurrency:
  group: stm8s103-FFT-spectrum-sdcc-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release_allowed: ${{ steps.release-clearance.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install --yes sdcc=4.2.0+dfsg-1 sdcc-libraries=4.2.0+dfsg-1 make python3

      - name: Verify and build firmware
        run: make verify

      - name: Check release clearance
        id: release-clearance
        run: |
          python3 -c 'import json; m=json.load(open("LICENSE_MANIFEST.json")); p=m.get("project_license", {}); allowed=p.get("rights_holder_confirmed") is True and p.get("release_allowed") is True and all(d.get("release_allowed") is True for d in m.get("third_party", [])); print("allowed=" + str(allowed).lower())' >> "$GITHUB_OUTPUT"

      - name: Upload firmware files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stm8s103-firmware
          path: |
            build/stm8s103-FFT-spectrum.ihx
            build/stm8s103-FFT-spectrum.bin
            build/stm8s103-FFT-spectrum.map
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release_allowed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download firmware artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: stm8s103-firmware
          path: dist

      - name: Verify release clearance
        run: make release-check

      - name: Publish pre-release and remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          release_tag="sdcc-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" \
            --target "$GITHUB_SHA" \
            --title "STM8S103 SDCC build $short_sha" \
            --notes "Automated pre-release from $GITHUB_REF_NAME at commit $GITHUB_SHA." \
            --prerelease \
            dist/stm8s103-FFT-spectrum.ihx \
            dist/stm8s103-FFT-spectrum.bin \
            dist/stm8s103-FFT-spectrum.map

          published_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" || "$old_tag" == "$release_tag" ]] && continue
            echo "Removing older release and tag: $old_tag"
            gh release delete "$old_tag" --cleanup-tag --yes
          done <<< "$published_tags"
